<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Activar notificaciones - Aura Global</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; text-align: center; }
    button { font-size: 1.1rem; padding: 12px 24px; border-radius: 8px; border: none; background: #2563eb; color: white; cursor: pointer; }
    button:disabled { background: #9ca3af; cursor: default; }
    textarea { width: 100%; height: 160px; margin-top: 20px; font-family: monospace; font-size: 0.75rem; }
    #status { margin-top: 16px; color: #374151; }
  </style>
</head>
<body>
  <h1>🌟 Notificaciones de Aura Global</h1>
  <p>Presiona el botón, acepta el permiso de notificaciones, y copia el texto que aparece abajo para pegarlo en la configuración de Vercel (PUSH_SUBSCRIPTIONS).</p>
  <button id="btn">Activar notificaciones</button>
  <div id="status"></div>
  <textarea id="output" readonly placeholder="Aquí aparecerá tu suscripción..."></textarea>

  <script>
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');
    const output = document.getElementById('output');

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
    }

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      status.textContent = 'Solicitando permiso...';

      try {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          status.textContent = 'No se concedió el permiso de notificaciones.';
          btn.disabled = false;
          return;
        }

        const registration = await navigator.serviceWorker.register('/sw.js');
        await navigator.serviceWorker.ready;

        const keyResponse = await fetch('/api/vapid-public-key');
        const { publicKey } = await keyResponse.json();

        const subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(publicKey),
        });

        output.value = JSON.stringify(subscription.toJSON(), null, 2) + ',';
        status.textContent = '¡Listo! Copia el texto de abajo y agrégalo al arreglo PUSH_SUBSCRIPTIONS en Vercel.';
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
